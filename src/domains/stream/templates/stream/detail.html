{% extends 'stream/base.html' %}
{% block title %}실시간 감지 상세{% endblock %}
{% block content %}
<style>
    .video-box {
        background: #f8f9fa;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        height: auto;
        overflow: hidden;
    }

    .video-box video {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        max-height: 420px;
        border-radius: 8px;
    }

    .video-placeholder {
        height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #777;
        font-size: 14px;
        background: #fafafa;
        border: 1px dashed #ccc;
        border-radius: 8px;
    }
</style>

<script crossorigin="anonymous"
        integrity="sha256-QTqD4rsMd+0L8L4QXVOdF+9F39mEoLE+zTsUqQE4OTg="
        src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>

<div class="row row-cols-1 g-4">
    <div class="col">
        <div class="video-box shadow-sm">
            <div class="fw-bold mb-2 text-dark">{{ user_stream.stream_name }}</div>
            <video autoplay id="video" muted></video>
        </div>
    </div>
</div>


<div class="mt-3 mb-4">
    <a class="btn btn-outline-dark"
       href="{{ url_for('stream.index') }}"
       style="font-size: 0.85rem; padding: 7px 16px; border-radius: 6px;">
        ← 실시간 감지 목록으로 돌아가기
    </a>
</div>

<script>
    const video = document.getElementById('video');
    const videoSrc = "{{ url_for('stream.hls', stream_key=user_stream.stream_key, filename='index.m3u8') }}";
    //
    // First check for native browser HLS support
    //
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
      //
      // If no native HLS support, check if HLS.js is supported
      //
    } else if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
    }
</script>
{% endblock %}
